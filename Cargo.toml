[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
keywords = ["sops", "encryption", "config"]
authors = ["Gabriel Hansson <gabrielhansson00@gmail.com>"]
repository = "https://github.com/gibbz00/rops"
license = "MPL-2.0"
exclude = ["/.github"]
edition = "2021"
readme = "README.md"
version = "0.1.7"

[workspace.dependencies]
aes-gcm = { version = "0.11" }
age = "0.12"
anyhow = "1"
aws-arn = "0.3"
aws-sdk-kms = { version = "1.129", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std", "now", "serde"] }
clap = { version = "4", features = ["derive"] }
console = "0.16"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
ctrlc = "3"
derive_more = { version = "2.1", features = ["display", "from", "deref", "deref_mut", "into", "as_ref"] }
directories = "6"
hybrid-array = { version = "0.4", features = ["zeroize"] }
hex = "0.4"
impl-tools = "0.13"
indexmap = "2"
indoc = "2"
pretty_assertions = "1"
rand = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_regex = "1"
serde_with = "3"
# Exact pin: `noyalib-serde-yaml` 0.0.58 depends on `noyalib` `=0.0.58`.
# Default features stay off so number formatting matches that crate.
noyalib = { version = "=0.0.58", default-features = false, features = ["std", "compat-serde-yaml"] }
serde_yaml = { package = "noyalib-serde-yaml", version = "=0.0.58" }
serde_json = "1"
serial_test = { version = "4", default-features = false }
sha2 = "0.11"
shlex = "2.0.1"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3"
test-binary = "3"
textwrap = "0.16"
thiserror = "2"
tokio = "1"
toml = "1.2"
walkdir = "2"
which = "8"
zeroize = { version = "1.9" }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# External crates do not need debuginfo. Workspace members keep the full dev/test setting.
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false
